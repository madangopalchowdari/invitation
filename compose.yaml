services:
  invitation:
    image: deepa-yashovardhan-invitation:nas
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set the public HTTPS invitation URL}
    restart: unless-stopped
    ports:
      - "192.168.0.211:3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set the public HTTPS invitation URL}
      RSVP_STORAGE_DIR: /data
      RSVP_PUBLIC_ORIGIN: ${NEXT_PUBLIC_SITE_URL:?Set the public HTTPS invitation URL}
      RSVP_ADMIN_TOKEN: ${RSVP_ADMIN_TOKEN:?Set RSVP_ADMIN_TOKEN in .env}
      NAS_MUSIC_FILE: /music/Kalyanam-Vaibhogam.mp3
    volumes:
      - type: bind
        source: /volume1/docker/invitation-nas/rsvp-data
        target: /data
      - type: bind
        source: /volume1/wedding-music/music
        target: /music
        read_only: true
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      - invitation